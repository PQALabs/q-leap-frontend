# ─────────────────────────────────────────────────────────────────────────────
# CI Workflow — runs on every Pull Request targeting main
# Place this file in the application repo at: .github/workflows/ci.yaml
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          push: false
          tags: q-leap-frontend:pr-${{ github.event.pull_request.number }}

